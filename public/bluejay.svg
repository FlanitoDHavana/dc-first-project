<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68ACE5" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#002D72" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#002D72" stop-opacity="0"/>
    </radialGradient>

    <!-- Hopkins Blue Gradient -->
    <linearGradient id="hopkinsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4B9C"/>
      <stop offset="50%" stop-color="#002D72"/>
      <stop offset="100%" stop-color="#00173D"/>
    </linearGradient>

    <!-- Jay Blue Accent Gradient -->
    <linearGradient id="jayBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AD3FF"/>
      <stop offset="50%" stop-color="#68ACE5"/>
      <stop offset="100%" stop-color="#3A82C7"/>
    </linearGradient>

    <!-- Beak Gold Gradient -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072"/>
      <stop offset="50%" stop-color="#F1BE48"/>
      <stop offset="100%" stop-color="#D99B16"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="200" cy="200" r="190" fill="url(#haloGlow)" />
  <circle cx="200" cy="200" r="172" fill="#071226" stroke="#68ACE5" stroke-width="6" filter="url(#cardShadow)"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#002D72" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Blue Jay Body / Chest Silhouette -->
  <path d="M 120 320 Q 150 260 210 260 Q 280 260 310 320 C 270 360 160 360 120 320 Z" fill="#002D72" stroke="#68ACE5" stroke-width="4"/>
  <path d="M 155 320 Q 200 275 250 275 Q 275 305 285 325 C 250 350 180 350 155 320 Z" fill="#F0F4F8"/>

  <!-- Jay Neck Collar (Black / Dark Navy band) -->
  <path d="M 140 250 Q 210 275 280 240 Q 265 210 245 220 Q 200 240 155 225 Z" fill="#07101E"/>

  <!-- Blue Jay Head / Crest -->
  <!-- Back Crest Feathers (Sharp sporty angles) -->
  <polygon points="120,130 65,70 145,95 85,35 185,75 140,20 225,65" fill="url(#hopkinsBlueGrad)" stroke="#68ACE5" stroke-width="3"/>
  <polygon points="140,80 95,45 175,70" fill="url(#jayBlueGrad)"/>

  <!-- Head Base -->
  <path d="M 140 110 Q 235 85 270 145 Q 295 190 275 235 Q 200 255 145 215 Q 125 165 140 110 Z" fill="url(#hopkinsBlueGrad)" stroke="#68ACE5" stroke-width="4"/>

  <!-- Jay Blue Crown Accent -->
  <path d="M 160 100 Q 220 85 250 125 Q 220 120 180 125 Z" fill="url(#jayBlueGrad)"/>

  <!-- White Face Mask / Cheek -->
  <path d="M 185 160 Q 240 145 260 185 Q 260 220 230 225 Q 175 220 170 180 Z" fill="#FFFFFF" stroke="#D3E3F5" stroke-width="2"/>

  <!-- Black Eye Mask Stripe -->
  <path d="M 185 160 Q 225 155 258 175 Q 240 195 200 185 Z" fill="#08111D"/>

  <!-- Fierce Eye -->
  <circle cx="218" cy="168" r="14" fill="#FFFFFF"/>
  <circle cx="221" cy="168" r="9" fill="#0B1526"/>
  <circle cx="223" cy="165" r="3.5" fill="#FFE072"/>
  <circle cx="224" cy="164" r="1.5" fill="#FFFFFF"/>

  <!-- Sharp Beak -->
  <!-- Upper Beak -->
  <path d="M 252 165 L 340 195 Q 290 215 255 210 Z" fill="url(#beakGrad)" stroke="#C68909" stroke-width="3"/>
  <!-- Beak Mouth Line -->
  <line x1="255" y1="188" x2="335" y2="196" stroke="#8C5C00" stroke-width="3"/>
  <!-- Lower Beak -->
  <path d="M 258 200 L 315 202 Q 285 225 254 212 Z" fill="#E5A61E" stroke="#C68909" stroke-width="2"/>

  <!-- JHU Athletic Lettering / Monogram on Base -->
  <rect x="160" y="300" width="80" height="30" rx="6" fill="#002D72" stroke="#68ACE5" stroke-width="2"/>
  <text x="200" y="322" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#F1BE48" text-anchor="middle" letter-spacing="3">JHU</text>
</svg>

